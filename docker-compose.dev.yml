# Development stack: includes docker-compose.yml and overrides the backend/
# frontend services with hot-reload dev servers.
#
# The base file is pulled in via `include`, so a single -f is enough:
#   docker compose -f docker-compose.dev.yml up --build
# (Passing both -f files explicitly also works and is equivalent.)
include:
  - docker-compose.yml
#
# This file sets a separate compose project name, so the dev stack gets its
# own containers, network and DATA VOLUMES (jiallo-dev_*) — fully isolated
# from a deployment running with docker-compose.yml alone (jiallo-oss_*).
# Both can run at the same time; their ports do not collide (5173/8233 vs 80).
name: jiallo-dev
#
# Frontend: http://localhost:5173 (Vite dev server, proxies /jiallo-backend to the backend)
# Backend:  http://localhost:8233 (Spring Boot with devtools hot-restart)
services:
  backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile.dev
    restart: "no"
    ports:
      - "8233:8233"
    environment:
      # application.yml disables devtools; re-enable hot-restart for dev.
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    volumes:
      - ./java-backend:/app
      - maven_repo:/root/.m2

  frontend:
    build:
      context: ./vue-frontend
      dockerfile: Dockerfile.dev
    restart: "no"
    # Replace the production "80:80" mapping with the Vite dev server port.
    ports: !override
      - "5173:5173"
    environment:
      # Target of the dev-server proxy (see vue-frontend/vite.config.ts).
      VITE_BACKEND_URL: http://backend:8233
    volumes:
      - ./vue-frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  maven_repo:
  frontend_node_modules:
