services:
  mysql:
    image: mysql:9.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?must set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?must set in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./java-backend/src/main/resources/db/migration/V1__init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.8
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:?must set in .env}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:?must set in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data

  backend:
    build: ./java-backend
    restart: unless-stopped
    # Run as the host user so files created in the bind-mounted claw-workspace
    # are owned by the host user instead of root (same convention as the dev
    # stack). Defaults to 1000:1000; override with APP_UID/APP_GID if needed.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # 让容器能通过 host.docker.internal 访问宿主机（如宿主机上的代理，见 TGBOT_PROXY_URL）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      AES_KEY: ${AES_KEY}
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-true}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      MINIO_ENDPOINT: http://rustfs:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-jiallo}
      JWT_SECRET: ${JWT_SECRET}
      BOCHA_API_KEY: ${BOCHA_API_KEY}
      # Flyway 自动迁移开关，默认开启；在 .env 设 FLYWAY_ENABLED=false 可关闭（改回手动执行 SQL）
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      # SSO Client 模式下由 SSO 服务端认定为管理员的外部用户 ID 列表（逗号分隔，可选）
      SSO_EXTERNAL_ADMIN_USER_IDS: ${SSO_EXTERNAL_ADMIN_USER_IDS:-}
      # 超级管理员用户 ID 列表（逗号分隔，可选）
      SUPER_ADMIN_USER_IDS: ${SUPER_ADMIN_USER_IDS:-}
      # Telegram Bot 代理（可选；proxyUrl 形如 http://127.0.0.1:7890 或 socks5://127.0.0.1:1080）
      TGBOT_PROXY_ENABLED: ${TGBOT_PROXY_ENABLED:-false}
      TGBOT_PROXY_URL: ${TGBOT_PROXY_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
    expose:
      - "8233"
    volumes:
      # Claw-like 工作区持久化到宿主机（容器默认工作区根路径为 /app/claw-workspace）。
      # 容器以上面的 user: 指定的宿主机用户运行，这里创建的文件归该用户所有；
      # 若目录已由旧 root 容器创建，请先 chown 给该用户，否则工作区创建会失败。
      - ./java-backend/claw-workspace:/app/claw-workspace

  frontend:
    build: ./vue-frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-}
    depends_on:
      - backend
    ports:
      - "${PORT:-80}:80"

volumes:
  mysql_data:
  redis_data:
  rustfs_data:
